[package]
name = "filecraft"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "A keyboard-first, BBS-style terminal file navigator for macOS"
license = "MIT"
repository = "https://github.com/hsuanchenlin/filecraft"
readme = "README.md"
keywords = ["tui", "file-manager", "bbs", "terminal", "macos"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "filecraft"
path = "src/main.rs"

[lib]
name = "filecraft"
path = "src/lib.rs"

[dependencies]
ratatui = "0.29"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
trash = { version = "5", default-features = false }

# Owner and group names come from the system user database, which has no
# std API. On macOS the answer is in Directory Services rather than in
# /etc/passwd, so `getpwuid_r`/`getgrgid_r` are the only correct source.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
